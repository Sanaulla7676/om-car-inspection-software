<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OMCAR Car Inspection Promo Animation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    overflow: hidden; 
    background: #0B0E13; 
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    user-select: none;
  }
  #wrapper {
    position: relative;
    width: 1920px;
    height: 1080px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

@media (max-width: 640px) {
  html, body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
  }
  body {
    height: 100%;
    min-height: 0;
    padding: 0;
  }
  #wrapper {
    width: min(100vw, calc(100svh * 9 / 16));
    height: min(100svh, calc(100vw * 16 / 9));
    max-width: none;
    max-height: none;
    aspect-ratio: 9 / 16;
    flex: 0 0 auto;
  }
  canvas {
    width: 100%;
    height: 100%;
    aspect-ratio: 9 / 16;
  }
}

</style>
</head>
<body>
<div id="wrapper">
  <canvas id="c" width="1920" height="1080"></canvas>
</div>

<script>
let IS_MOBILE_LAYOUT = window.matchMedia("(max-width: 640px)").matches;
let W = IS_MOBILE_LAYOUT ? 1080 : 1920;
let H = IS_MOBILE_LAYOUT ? 1920 : 1080;
const canvas = document.getElementById('c');
// Render mobile at 720x1280 (still 9:16) to cut canvas pixel work by about 55%.
canvas.width = IS_MOBILE_LAYOUT ? 720 : 1920;
canvas.height = IS_MOBILE_LAYOUT ? 1280 : 1080;
const ctx = canvas.getContext('2d');
if (IS_MOBILE_LAYOUT) ctx.scale(canvas.width / W, canvas.height / H);


// ─── OMCAR BRAND ASSETS (logo + exactly three photographs) ───
// Provide each asset either as a base64 data URI below (fully self-contained, like the original),
// or leave the string empty and place the file next to this HTML with the default file name.
// Run embed-omcar-assets.py to inline the four files automatically.
const B64_OMCAR_LOGO = "";   // official OMCAR logo           (default file: omcar-logo.png)
const B64_OMCAR_PDI = "";   // 01 NEW CAR PDI photo          (default file: omcar-new-car-pdi.jpg)
const B64_OMCAR_USED = "";   // 02 USED CAR INSPECTION photo  (default file: omcar-used-car-inspection.jpg)
const B64_OMCAR_TRAINING = "";   // 03 PDI TRAINING photo         (default file: omcar-pdi-training.jpg)
const B64_OMCAR_CAR = "";   // car on platform (transparent) (default file: omcar-car-platform.png)

function loadAsset(_embedded, file) {
  const im = new Image();
  im.decoding = "async";
  im.fetchPriority = "low";
  im.dataset.assetPath = "/omcar-promo-assets/" + file;
  return im;
}
function ensureAsset(im) {
  if (!im || im.dataset.assetLoaded === "1") return;
  im.dataset.assetLoaded = "1";
  im.src = im.dataset.assetPath;
  if (typeof im.decode === "function") void im.decode().catch(() => undefined);
}
const imgLogo     = loadAsset("", "omcar-logo.png");
const imgPDI      = loadAsset("", "omcar-new-car-pdi.jpg");
const imgUsed     = loadAsset("", "omcar-used-car-inspection.jpg");
const imgTraining = loadAsset("", "omcar-pdi-training.jpg");
const imgCar      = loadAsset("", "omcar-car-platform.png");

// Desktop retains its original eager image availability. Mobile fetches each
// scene's assets shortly before they are needed, rather than downloading 2 MB at iframe startup.
if (!IS_MOBILE_LAYOUT) [imgLogo, imgPDI, imgUsed, imgTraining, imgCar].forEach(ensureAsset);


// ─── PALETTE (OMCAR) ───
const CORAL      = '#0084FF';
const DEEP_CORAL = '#0069CC';
const INK        = '#11151C';
const DEEP_BLACK = '#0B0E13';
const WARM       = '#F5F5F2';
const WHITE      = '#FFFFFF';
const MUTED      = '#656E7B';
const BORDER     = '#E0E3E8';
const ICE_BLUE   = '#9ECBFF';
const TEAL       = '#087B91';
const DARK_BG    = DEEP_BLACK;

// ─── EASING & MATH ───

function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function lerp(a, b, t) { return a + (b - a) * clamp01(t); }
function remap(v, a, b) { return clamp01((v - a) / (b - a)); }
function easeOutExpo(t) { return t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); }
function easeInExpo(t) { return t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, 10 * (t - 1)); }
function easeOutCubic(t) { t = clamp01(t); return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { t = clamp01(t); return t * t * t; }
function spring(t, f = 3.5, d = 7) {
  if (t <= 0) return 0;
  if (t >= 1.5) return 1;
  return 1 - Math.exp(-d * t) * Math.cos(2 * Math.PI * f * t);
}

const FF = '"Plus Jakarta Sans", -apple-system, sans-serif';
function font(weight, size) { return `${weight} ${size}px ${FF}`; }

function drawRRect(x, y, w, h, r, fill, stroke, sw = 2) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); }
}

function drawText(txt, x, y, f, color, align = 'left', baseline = 'top') {
  ctx.font = f;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  ctx.fillText(txt, x, y);
}

function fillBG(color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, W, H);
}

function drawDotGrid(opacity) {
  if (opacity <= 0) return;
  ctx.save();
  ctx.fillStyle = `rgba(150, 158, 170, ${opacity * 0.45})`;
  const sp = 34;
  for (let gx = sp; gx < W; gx += sp) {
    for (let gy = sp; gy < H; gy += sp) {
      ctx.beginPath();
      ctx.arc(gx, gy, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// ─── LAYOUT HELPERS (text fitting + aspect-preserving image crop) ───
function fitFont(txt, weight, size, maxW, minSize = 12) {
  let s = size;
  ctx.font = font(weight, s);
  while (s > minSize && ctx.measureText(txt).width > maxW) {
    s -= 1;
    ctx.font = font(weight, s);
  }
  return font(weight, s);
}

function imgReady(img) { return !!(img && img.complete && img.naturalWidth > 0); }

// Cover-crop: fills (x,y,w,h) without stretching; crop is centred.
function drawCover(img, x, y, w, h) {
  const ir = img.naturalWidth / img.naturalHeight;
  const r = w / h;
  let sw, sh, sx, sy;
  if (ir > r) { sh = img.naturalHeight; sw = sh * r; sx = (img.naturalWidth - sw) / 2; sy = 0; }
  else        { sw = img.naturalWidth;  sh = sw / r; sx = 0; sy = (img.naturalHeight - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

// Full-screen presentation of a portrait poster: blurred cover backdrop + uncropped poster at full height.
const _bgCache = new Map();
function posterBackdrop(img) {
  let c = _bgCache.get(img);
  if (!c) {
    c = document.createElement('canvas'); c.width = 480; c.height = 270;
    const g = c.getContext('2d');
    g.filter = 'blur(10px)';
    const ir = img.naturalWidth / img.naturalHeight, r = c.width / c.height;
    let sw = img.naturalWidth, sh = sw / r;
    if (ir > r) { sh = img.naturalHeight; sw = sh * r; }
    g.drawImage(img, (img.naturalWidth - sw) / 2, (img.naturalHeight - sh) / 2, sw, sh, -20, -20, c.width + 40, c.height + 40);
    g.filter = 'none';
    g.fillStyle = 'rgba(11, 14, 19, 0.55)';
    g.fillRect(0, 0, c.width, c.height);
    _bgCache.set(img, c);
  }
  return c;
}
function drawPosterFull(img, label) {
  if (!imgReady(img)) { drawPhotoSlot(-W / 2, -H / 2, W, H, label); return; }
  ctx.drawImage(posterBackdrop(img), -W / 2, -H / 2, W, H);
  const ph = H, pw = H * img.naturalWidth / img.naturalHeight;
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
  ctx.shadowBlur = 50;
  ctx.drawImage(img, -pw / 2, -ph / 2, pw, ph);
  ctx.restore();
}

// Neutral, clearly-labelled slot shown ONLY when a real OMCAR photo has not been supplied.
function drawPhotoSlot(x, y, w, h, label) {
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, INK);
  g.addColorStop(1, DEEP_BLACK);
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  const m = Math.min(w, h) * 0.06;
  ctx.save();
  ctx.setLineDash([14, 12]);
  ctx.strokeStyle = 'rgba(0, 132, 255, 0.55)';
  ctx.lineWidth = 3;
  ctx.strokeRect(x + m, y + m, w - m * 2, h - m * 2);
  ctx.restore();
  const fs = Math.max(14, Math.min(w, h) * 0.04);
  drawText('OMCAR PHOTO REQUIRED', x + w / 2, y + h / 2 - fs * 0.9, font(800, fs), CORAL, 'center', 'middle');
  drawText(label, x + w / 2, y + h / 2 + fs * 0.9, fitFont(label, 700, fs * 1.1, w - m * 4), 'rgba(255,255,255,0.75)', 'center', 'middle');
}

function drawPhoto(img, x, y, w, h, label) {
  if (imgReady(img)) drawCover(img, x, y, w, h);
  else drawPhotoSlot(x, y, w, h, label);
}

// ─── CAR SILHOUETTE (side profile, facing right; length 200 units, ground at y=+35) ───
function drawCarShape(body, glass, wheel, rim, gap, accent) {
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-98, 12);
  ctx.lineTo(-99, -6);
  ctx.quadraticCurveTo(-99, -16, -90, -19);
  ctx.lineTo(-72, -24);
  ctx.quadraticCurveTo(-66, -38, -52, -40);
  ctx.lineTo(18, -40);
  ctx.quadraticCurveTo(30, -40, 40, -30);
  ctx.lineTo(60, -14);
  ctx.lineTo(90, -9);
  ctx.quadraticCurveTo(100, -7, 100, 2);
  ctx.lineTo(100, 12);
  ctx.closePath();
  ctx.fill();

  if (glass) {
    ctx.fillStyle = glass;
    ctx.beginPath();
    ctx.moveTo(-66, -22);
    ctx.lineTo(-55, -35);
    ctx.lineTo(16, -35);
    ctx.quadraticCurveTo(25, -35, 32, -28);
    ctx.lineTo(46, -22);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = body;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-14, -36);
    ctx.lineTo(-14, -21);
    ctx.stroke();
  }

  if (accent) {
    ctx.fillStyle = accent;
    ctx.fillRect(-92, -3, 188, 3);
  }

  for (const wx of [-58, 58]) {
    ctx.beginPath();
    ctx.arc(wx, 14, 21, 0, Math.PI * 2);
    ctx.fillStyle = wheel;
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = gap;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(wx, 14, 9, 0, Math.PI * 2);
    ctx.fillStyle = rim;
    ctx.fill();
  }
}

// ─── OMCAR CAR + PLATFORM IMAGE, ROTATING TURNTABLE (replaces suitcase) ───
// A single photo cannot truly orbit, so the car + platform yaw continuously
// (perspective turntable sway) with a slow shine sweep; swap in more angles for a full 360.
function drawCarTurntable(cx, cy, scale, opacity, tt) {
  if (opacity <= 0) return;
  const iw = 640, ih = iw * imgCar.naturalHeight / imgCar.naturalWidth;
  const ph = tt * 2 * Math.PI / 4.2;                 // one full turn every 4.2 s
  const yaw = Math.cos(ph);
  const sx = 1, sk = 0;                              // car + platform are static
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.translate(cx, cy + 25);
  ctx.scale(scale, scale);
  ctx.transform(sx, 0, sk * sx, 1, 0, 0);
  ctx.drawImage(imgCar, -iw / 2, -ih / 2 - 10, iw, ih);
  ctx.restore();
}

// ─── CAR ON CIRCULAR INSPECTION PLATFORM (vector fallback) ───
function drawInspectionPlatform(cx, cy, scale, opacity, tt) {
  if (opacity <= 0) return;
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  const py = 40;           // platform surface centre (car wheels sit here)
  const rx = 250, ry = 60; // platform radii (perspective ellipse)
  const thick = 18;

  // soft ground shadow
  ctx.fillStyle = 'rgba(17, 21, 28, 0.14)';
  ctx.beginPath();
  ctx.ellipse(0, py + thick + 14, rx * 1.05, ry * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();

  // platform side wall
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.ellipse(0, py + thick, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(-rx, py, rx * 2, thick);
  ctx.beginPath();
  ctx.ellipse(0, py + thick, rx, ry, 0, 0, Math.PI);
  ctx.fill();

  // platform top surface
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.ellipse(0, py, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = BORDER;
  ctx.lineWidth = 2;
  ctx.stroke();

  // subtle automotive-teal stage light (right edge) and soft coral pool
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, py, rx, ry, 0, 0, Math.PI * 2);
  ctx.clip();
  const tg = ctx.createRadialGradient(rx * 0.85, py, 0, rx * 0.85, py, rx * 0.7);
  tg.addColorStop(0, 'rgba(8, 123, 145, 0.16)');
  tg.addColorStop(1, 'rgba(8, 123, 145, 0)');
  ctx.fillStyle = tg;
  ctx.fillRect(-rx, py - ry, rx * 2, ry * 2);
  ctx.translate(0, py);
  ctx.scale(1, ry / rx);
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  cg.addColorStop(0, 'rgba(0, 132, 255, 0.30)');
  cg.addColorStop(1, 'rgba(0, 132, 255, 0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(0, 0, rx, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // rotating inspection ring
  ctx.save();
  ctx.strokeStyle = CORAL;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.setLineDash([22, 14]);
  ctx.lineDashOffset = -tt * 60;
  ctx.beginPath();
  ctx.ellipse(0, py, rx * 0.9, ry * 0.9, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(0, 132, 255, 0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(0, py, rx * 0.72, ry * 0.72, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // contact shadow under the car
  ctx.fillStyle = 'rgba(17, 21, 28, 0.28)';
  ctx.beginPath();
  ctx.ellipse(0, py + 2, 125, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  // the car, grounded on the platform
  ctx.save();
  ctx.translate(0, py - 35 * 1.15);
  ctx.scale(1.15, 1.15);
  drawCarShape(INK, 'rgba(158, 203, 255, 0.85)', '#1B212B', '#9AA3AF', WHITE, CORAL);
  ctx.restore();

  ctx.restore();
}

// ─── BOARDING PASS → VEHICLE INSPECTION CARD ───
function drawBoardingPass(cx, cy, angle, scale, opacity, destCode, stampProgress) {
  if (opacity <= 0) return;
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  const pw = 580, ph = 330;

  ctx.shadowColor = 'rgba(17, 21, 28, 0.18)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetX = 8;
  ctx.shadowOffsetY = 16;

  drawRRect(-pw / 2, -ph / 2, pw * 0.77, ph, 16, WHITE);
  drawRRect(-pw / 2 + pw * 0.77 + 5, -ph / 2, pw * 0.23 - 5, ph, 16, WHITE);
  ctx.shadowColor = 'transparent';

  drawRRect(-pw / 2, -ph / 2, pw * 0.77, 56, [16, 16, 0, 0], CORAL);
  drawRRect(-pw / 2 + pw * 0.77 + 5, -ph / 2, pw * 0.23 - 5, 56, [16, 16, 0, 0], CORAL);

  drawText("VEHICLE INSPECTION CARD", -pw / 2 + 20, -ph / 2 + 18, font(700, 14), WHITE);
  drawText("OMCAR", -pw / 2 + pw * 0.77 - 95, -ph / 2 + 17, font(800, 16), WHITE);
  drawText("OMCAR", -pw / 2 + pw * 0.77 + 22, -ph / 2 + 17, font(800, 14), WHITE);

  ctx.setLineDash([5, 5]);
  ctx.strokeStyle = BORDER;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-pw / 2 + pw * 0.77 + 2.5, -ph / 2 + 56);
  ctx.lineTo(-pw / 2 + pw * 0.77 + 2.5, ph / 2);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = WARM;
  ctx.beginPath();
  ctx.arc(-pw / 2 + pw * 0.77 + 2.5, -ph / 2, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-pw / 2 + pw * 0.77 + 2.5, ph / 2, 10, 0, Math.PI * 2);
  ctx.fill();

  const bx = -pw / 2 + 26, by = -ph / 2 + 76;
  drawText("VEHICLE", bx, by, font(600, 12), MUTED);
  drawText("SUV", bx, by + 16, font(800, 52), INK);
  drawText("PREMIUM SUV", bx, by + 74, font(600, 14), MUTED);

  // minimal automotive symbol (replaces the plane glyph)
  const ax = bx + 160, ay = by + 46;
  ctx.fillStyle = CORAL;
  ctx.beginPath();
  ctx.arc(ax, ay, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.translate(ax, ay + 1);
  ctx.scale(0.14, 0.14);
  drawCarShape(WHITE, CORAL, WHITE, CORAL, CORAL, null);
  ctx.restore();

  drawText("SERVICE", bx + 230, by, font(600, 12), MUTED);
  drawText(destCode, bx + 230, by + 16, fitFont(destCode, 800, 52, 172, 20), INK);

  const fy = by + 115;
  const details = [
    ["CUSTOMER", "YOU"],
    ["SERVICE", "PDI"],
    ["SCOPE", "VISUAL"],
    ["STATUS", "NEW"]
  ];
  details.forEach(([lbl, val], idx) => {
    const dx = bx + idx * 95;
    drawText(lbl, dx, fy, font(600, 11), MUTED);
    drawText(val, dx, fy + 16, font(800, 19), INK);
  });

  const sx = -pw / 2 + pw * 0.77 + 20;
  ctx.fillStyle = INK;
  for (let i = 0; i < 18; i++) {
    const bw = (i % 3 === 0) ? 3.5 : (i % 2 === 0 ? 1.5 : 2.5);
    ctx.fillRect(sx + i * 5.5, -ph / 2 + 74, bw, 70);
  }
  drawText("PDI", sx + 12, ph / 2 - 55, font(800, 36), INK);

  if (stampProgress > 0) {
    ctx.save();
    const sProg = clamp01(stampProgress);
    const sScale = lerp(2.2, 1.0, easeOutExpo(sProg));
    const sAlpha = easeOutCubic(sProg);
    ctx.globalAlpha = sAlpha * 0.95;
    ctx.translate(bx + 280, by + 90);
    ctx.rotate(-0.22);
    ctx.scale(sScale, sScale);

    ctx.strokeStyle = CORAL;
    ctx.lineWidth = 4;
    drawRRect(-95, -28, 190, 56, 8, 'rgba(0, 132, 255, 0.08)', CORAL, 4);
    ctx.lineWidth = 1.5;
    drawRRect(-90, -23, 180, 46, 6, null, CORAL, 1.5);

    // two-line stamp so REQUEST RECEIVED fits the original stamp box
    drawText("REQUEST", 0, -11, font(800, 19), CORAL, 'center', 'middle');
    drawText("RECEIVED", 0, 11, font(800, 19), CORAL, 'center', 'middle');
    ctx.restore();
  }

  ctx.restore();
}

// ─── SCENE 1 (0.0s – 2.05s): Hook & Vehicle Inspection Card ───
function renderScene1(t) {
  fillBG(WARM);
  drawDotGrid(1.0);

  const grad = ctx.createRadialGradient(W * 0.75, H * 0.4, 0, W * 0.75, H * 0.4, 600);
  grad.addColorStop(0, 'rgba(0, 132, 255, 0.12)');
  grad.addColorStop(1, 'rgba(0, 132, 255, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const tApp = spring(remap(t, 0.0, 0.45), 3.5, 7.5);
  const tx = lerp(-500, 120, tApp);

  // headline lines are fitted so the wide capitals never reach the card
  const hMax = 880;
  drawText("BEFORE YOU DECIDE", tx, 220, font(700, 20), CORAL);
  drawText("SEE BEYOND", tx, 290, fitFont("SEE BEYOND", 800, 135, hMax, 60), INK);
  drawText("THE", tx, 435, font(800, 135), INK);
  drawText("SURFACE.", tx, 580, fitFont("SURFACE.", 800, 135, hMax, 60), CORAL);

  const pApp = spring(remap(t, 0.25, 0.75), 3.0, 6.5);
  const passX = lerp(W + 400, W * 0.72, pApp);
  const passY = 460;
  const passAngle = lerp(0.2, 0.07, pApp);

  let destCode = 'NEW CAR PDI';
  if (t < 0.95) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const fProg = remap(t, 0.35, 0.95);
    const k = Math.floor(fProg * 24);
    destCode = chars[(k * 3) % 26] + chars[(k * 7) % 26] + chars[(k * 11) % 26];
  }

  const stampProg = remap(t, 1.4, 1.65);
  drawBoardingPass(passX, passY, passAngle, 1.0, clamp01(pApp * 2), destCode, stampProg);

  if (t >= 1.68) {
    const expProg = easeInCubic(remap(t, 1.68, 2.05));
    const r = lerp(0, 2600, expProg);
    ctx.fillStyle = '#0084FF';
    ctx.beginPath();
    ctx.arc(passX - 80, passY - 30, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ─── SCENE 2 (2.05s – 4.10s): Kinetic Car Orbit ───
function renderScene2(t) {
  fillBG('#0084FF');

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.5;
  for (let r = 120; r <= 800; r += 130) {
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  const orbitT = remap(t, 2.0, 4.0);
  const angle = orbitT * Math.PI * 2.2 - Math.PI * 0.6;
  const ocx = W / 2, ocy = H / 2;
  const rx = 440, ry = 190;
  const px = ocx + Math.cos(angle) * rx;
  const py = ocy + Math.sin(angle) * ry;
  const tangent = Math.atan2(Math.cos(angle) * ry, -Math.sin(angle) * rx);

  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
  ctx.setLineDash([4, 8]);
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let a = angle - Math.PI * 1.6; a <= angle; a += 0.04) {
    const tx = ocx + Math.cos(a) * rx;
    const ty = ocy + Math.sin(a) * ry;
    if (a === angle - Math.PI * 1.6) ctx.moveTo(tx, ty);
    else ctx.lineTo(tx, ty);
  }
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(tangent);
  ctx.scale(2.4, 2.4);
  // keep the wheels toward the ground when the orbit runs right-to-left
  if (Math.cos(tangent) < 0) ctx.scale(1, -1);
  ctx.scale(0.28, 0.28);
  drawCarShape(WHITE, 'rgba(0, 132, 255, 0.55)', WHITE, '#0084FF', '#0084FF', null);
  ctx.restore();

  if (t < 3.0) {
    const aIn = easeOutExpo(remap(t, 2.0, 2.4));
    const aOut = easeInCubic(remap(t, 2.7, 3.0));
    const alpha = aIn * (1 - aOut);
    const yShift = lerp(40, 0, aIn) + lerp(0, -120, aOut);

    ctx.save();
    ctx.globalAlpha = alpha;
    if (aOut > 0.1) ctx.filter = `blur(${aOut * 12}px)`;
    drawText("DON'T GUESS.", W / 2, H / 2 + yShift, fitFont("DON'T GUESS.", 800, 110, 1500, 60), WHITE, 'center', 'middle');
    ctx.restore();
  } else {
    const bIn = easeOutExpo(remap(t, 3.0, 3.45));
    ctx.save();
    ctx.globalAlpha = bIn;
    const yShift = lerp(80, 0, bIn);

    const pillW = 220, pillH = 72;
    const phrase = "CHECK BEFORE YOU ";
    const f1 = fitFont(phrase, 800, 85, 1560 - pillW, 40);
    ctx.font = f1;
    const w1 = ctx.measureText(phrase).width;
    const totalW = w1 + pillW;
    const startX = W / 2 - totalW / 2;
    const cy = H / 2 + yShift;

    drawText("CHECK BEFORE YOU", startX, cy, f1, WHITE, 'left', 'middle');
    drawRRect(startX + w1, cy - pillH / 2, pillW, pillH, 36, WHITE);
    drawText("COMMIT.", startX + w1 + pillW / 2, cy, font(800, 38), CORAL, 'center', 'middle');
    ctx.restore();
  }

  if (t >= 3.7) {
    const wipeProg = easeOutExpo(remap(t, 3.7, 4.15));
    const r = lerp(0, 2400, wipeProg);
    ctx.save();
    ctx.fillStyle = WARM;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

    ctx.shadowBlur = 35;
    drawRRect(-cw / 2, -ch / 2, cw, ch, 20, WHITE, CORAL, 3);

      ctx.save();

      drawText("DOCUMENTED FINDINGS, NOT GUARANTEES.", W / 2, H - 110, font(700, 22), INK, 'center', 'middle');

  if (t >= 4.5 && t < 8.5) {

    ctx.fillStyle = DARK_BG;
    ctx.globalAlpha = zoomP;
    ctx.fillRect(0, 0, W, H);

// ─── SCENE 5 (11.95s – 13.0s): 3-Card Deck & Suction ───
function renderScene5(t) {
  fillBG(DARK_BG);

  const intro = easeOutExpo(remap(t, 11.85, 12.2));
  const collapse = easeInExpo(remap(t, 12.55, 12.95));

  if (intro > 0 && collapse < 1) {
    ctx.save();
    ctx.globalAlpha = intro * (1 - collapse);
    drawText("ONE METHOD. THREE PATHWAYS.", W / 2, 90, font(800, 48), WHITE, 'center', 'top');
    ctx.restore();
  }

  const cw = 440, ch = 560;
  const gap = 36;
  const totalW = 3 * cw + 2 * gap;
  const sx = W / 2 - totalW / 2;

  const cardData = [
    { img: imgPDI, label: '01 — NEW CAR PDI' },
    { img: imgUsed, label: '02 — USED CAR INSPECTION' },
    { img: imgTraining, label: '03 — PDI TRAINING' }
  ];

  for (let i = 0; i < 3; i++) {
    const baseCx = sx + cw / 2 + i * (cw + gap);
    const baseCy = H / 2 + 45;

    const curCx = lerp(baseCx, W / 2, collapse);
    const curCy = lerp(baseCy, H / 2, collapse);
    const curScale = lerp(1.0, 0.05, collapse);
    const alpha = intro * (1 - Math.pow(collapse, 3));

    if (alpha <= 0) continue;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(curCx, curCy);
    ctx.scale(curScale, curScale);

    ctx.beginPath();
    ctx.roundRect(-cw / 2, -ch / 2, cw, ch, 24);
    ctx.clip();

    drawPhoto(cardData[i].img, -cw / 2, -ch / 2, cw, ch, cardData[i].label.slice(5));

    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(curCx, curCy);
    ctx.scale(curScale, curScale);
    const lbl = cardData[i].label;
    drawText(lbl, 0, ch / 2 + 34, fitFont(lbl, 800, 26, cw, 14), WHITE, 'center', 'middle');
    ctx.restore();
  }

  if (collapse > 0.2) {
    const orbP = remap(collapse, 0.2, 1.0);
    const orbR = lerp(8, 28, easeOutExpo(orbP));
    ctx.save();
    ctx.fillStyle = CORAL;
    ctx.shadowColor = CORAL;
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, orbR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  if (t >= 12.85) {
    const fIn = easeOutExpo(remap(t, 12.85, 13.2));
    const r = lerp(0, 2600, fIn);
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

    ctx.restore();
  } else {
    const enter = easeOutExpo(remap(t, 3.05, 3.42));
    ctx.save();
    ctx.globalAlpha = enter;
    drawText("CHECK BEFORE YOU", W / 2, 280, fitFont("CHECK BEFORE YOU", 800, 68, 990, 42), WHITE, "center", "middle");
    drawRRect(115, 355, 850, 102, 50, WHITE);
    drawText("COMMIT.", W / 2, 406, font(800, 55), CORAL, "center", "middle");
    ctx.restore();
  }

  if (t >= 3.7) {
    const wipe = easeOutExpo(remap(t, 3.7, 4.15));
    ctx.fillStyle = WARM;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, lerp(0, 2500, wipe), 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderMobileScene3(t) {
  fillBG(WARM);
  drawDotGrid(.55);

  const titleIn = easeOutExpo(remap(t, 4.15, 4.62));
  ctx.save();
  ctx.globalAlpha = titleIn;
  drawText("LOOK CLOSER.", W / 2, 105, font(700, 34), MUTED, "center");
  drawText("EVERY DETAIL", W / 2, 175, fitFont("EVERY DETAIL", 800, 77, 980, 48), INK, "center");
  drawText("MATTERS.", W / 2, 260, fitFont("MATTERS.", 800, 88, 980, 52), CORAL, "center");
  ctx.restore();

  const carIn = spring(remap(t, 4.08, 4.7), 2.8, 6.3);
  const carY = lerp(870, 715, carIn);
  if (imgReady(imgCar)) drawCarTurntable(W / 2, carY, 1.16, clamp01(carIn * 2), t);
  else drawInspectionPlatform(W / 2, carY, 1.3, clamp01(carIn * 2), t);

  const steps = [
    {t0:4.5,num:"01",title:"Vehicle Identity & Documents",status:"REVIEW SCOPE"},
    {t0:5.0,num:"02",title:"Paint, Panels & Glass",status:"VISUAL CHECK"},
    {t0:5.5,num:"03",title:"Lights, Trim & Visible Damage",status:"OBSERVATION"},
    {t0:6.0,num:"04",title:"Tyres & Wheels",status:"ACCESSIBLE CHECK"},
    {t0:6.8,num:"05",title:"Cabin & Warning Indicators",status:"FOLLOW-UP"},
    {t0:7.4,num:"06",title:"Photo Evidence & Inspection Report",status:"DOCUMENT FINDINGS"}
  ];
  let current = steps[0];
  for (let i = steps.length - 1; i >= 0; i--) if (t >= steps[i].t0) { current = steps[i]; break; }
  const done = t >= 7.9;
  const inP = done ? easeOutExpo(remap(t, 7.9, 8.2)) : spring(remap(t, current.t0, current.t0 + .28), 3.3, 7.8);
  const cardW = 960, cardH = 132, cardX = (W - cardW) / 2, cardY = 1120;
  ctx.save();
  ctx.globalAlpha = inP;
  ctx.shadowColor = "rgba(17,21,28,.12)";
  ctx.shadowBlur = 26;
  ctx.shadowOffsetY = 8;
  drawRRect(cardX, cardY, cardW, cardH, 22, WHITE, done ? CORAL : BORDER, done ? 3 : 2);
  ctx.shadowColor = "transparent";
  drawRRect(cardX + 22, cardY + 34, 66, 66, 17, CORAL);
  drawText(done ? "06" : current.num, cardX + 55, cardY + 67, font(800, 26), WHITE, "center", "middle");
  const title = done ? "CLEAR FINDINGS. HONEST LIMITS." : current.title;
  const status = done ? "6 / 6" : current.status;
  drawText(title, cardX + 118, cardY + 45, fitFont(title, 800, 35, 680, 20), INK, "left", "middle");
  drawText(status, cardX + 118, cardY + 93, fitFont(status, 700, 20, 700, 14), CORAL, "left", "middle");
  ctx.restore();

  const areaCount = done ? 6 : steps.indexOf(current) + 1;
  const dotGap = 35;
  const startX = W / 2 - (6 * dotGap) / 2;
  const dotY = 1775;
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i < areaCount ? CORAL : BORDER;
    ctx.beginPath();
    ctx.arc(startX + i * dotGap, dotY, 7, 0, Math.PI * 2);
    ctx.fill();
  }
  drawText(done ? "6 INSPECTION AREAS" : areaCount + " OF 6 INSPECTION AREAS", W / 2, 1810, font(700, 21), MUTED, "center", "middle");

  if (t >= 8.45) {
    ctx.save();
    ctx.globalAlpha = easeInExpo(remap(t, 8.45, 8.85));
    fillBG(DARK_BG);
    ctx.restore();
  }
}

function renderMobileScene4(t) {
  fillBG(DARK_BG);
  const scenes = [
    {start:8.75,end:9.8,img:imgPDI,num:"01 / 03",name:"NEW CAR PDI"},
    {start:9.75,end:10.8,img:imgUsed,num:"02 / 03",name:"USED CAR INSPECTION"},
    {start:10.75,end:11.95,img:imgTraining,num:"03 / 03",name:"PDI TRAINING"}
  ];
  for (const scene of scenes) {
    if (t < scene.start || t >= scene.end + .15) continue;
    const fadeIn = easeOutExpo(remap(t, scene.start, scene.start + .25));
    const fadeOut = t >= scene.end ? easeInCubic(remap(t, scene.end, scene.end + .15)) : 0;
    ctx.save();
    ctx.globalAlpha = fadeIn * (1 - fadeOut);
    const zoom = lerp(1, 1.035, remap(t, scene.start, scene.end));
    ctx.translate(W / 2, H / 2);
    ctx.scale(zoom, zoom);
    drawPosterFull(scene.img, scene.name);
    ctx.restore();

    const label = scene.name;
    const fontSize = label.length > 16 ? 48 : 60;
    const labelFont = fitFont(label, 800, fontSize, 900, 34);
    ctx.font = labelFont;
    const labelW = Math.min(970, ctx.measureText(label).width + 90);
    const labelH = 150, lx = (W - labelW) / 2, ly = H - 245;
    ctx.save();
    ctx.globalAlpha = fadeIn * (1 - fadeOut);
    ctx.shadowColor = "rgba(0,0,0,.4)";
    ctx.shadowBlur = 28;
    drawRRect(lx, ly, labelW, labelH, 22, "rgba(11,14,19,.93)");
    ctx.shadowColor = "transparent";
    drawRRect(lx, ly, 12, labelH, [22,0,0,22], "#0084FF");
    const silver = ctx.createLinearGradient(0, ly, 0, ly + labelH);
    silver.addColorStop(0, "#FFFFFF");
    silver.addColorStop(.5, "#BFC7D1");
    silver.addColorStop(1, "#EEF1F4");
    drawText(label, W / 2, ly + labelH / 2, labelFont, silver, "center", "middle");
    drawText(scene.num, W / 2, 1790, font(700, 24), "rgba(255,255,255,.78)", "center", "middle");
    ctx.restore();
  }
}

function renderMobileScene5(t) {
  fillBG(DARK_BG);
  const intro = easeOutExpo(remap(t, 11.85, 12.2));
  const collapse = easeInExpo(remap(t, 12.55, 12.95));
  ctx.save();
  ctx.globalAlpha = intro * (1 - collapse);
  drawText("ONE METHOD.", W / 2, 112, font(800, 60), WHITE, "center", "middle");
  drawText("THREE PATHWAYS.", W / 2, 190, fitFont("THREE PATHWAYS.", 800, 68, 990, 42), "#0084FF", "center", "middle");
  ctx.restore();

  const cards = [
    {img:imgPDI,number:"01",title:"NEW CAR PDI",detail:"Check before accepting delivery."},
    {img:imgUsed,number:"02",title:"USED CAR INSPECTION",detail:"Understand condition before buying."},
    {img:imgTraining,number:"03",title:"PDI TRAINING",detail:"Learn the inspection method."}
  ];
  const cardX = 50, cardW = 980, cardH = 340, gap = 32, startY = 370;
  for (let i = 0; i < cards.length; i++) {
    const card = cards[i];
    const progress = spring(remap(t, 11.95 + i * .08, 12.3 + i * .08), 3.2, 7.4);
    const y = startY + i * (cardH + gap) + lerp(35, 0, progress);
    const scale = lerp(.96, 1, progress) * lerp(1, .08, collapse);
    const alpha = intro * (1 - Math.pow(collapse, 3));
    if (alpha <= .001) continue;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, y + cardH / 2);
    ctx.scale(scale, scale);
    drawRRect(-cardW / 2, -cardH / 2, cardW, cardH, 24, "#F7F8FA", "rgba(255,255,255,.38)", 2);
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(-cardW / 2 + 18, -cardH / 2 + 18, 265, cardH - 36, 18);
    ctx.clip();
    drawPhoto(card.img, -cardW / 2 + 18, -cardH / 2 + 18, 265, cardH - 36, card.title);
    ctx.restore();
    drawText(card.number, -cardW / 2 + 325, -80, font(800, 28), CORAL);
    drawText(card.title, -cardW / 2 + 325, -18, fitFont(card.title, 800, 48, 610, 26), INK);
    drawText(card.detail, -cardW / 2 + 325, 62, fitFont(card.detail, 600, 27, 600, 18), MUTED);
    ctx.restore();
  }

  if (collapse > .2) {
    const orb = easeOutExpo(remap(collapse, .2, 1));
    ctx.save();
    ctx.fillStyle = CORAL;
    ctx.shadowColor = CORAL;
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, lerp(8, 35, orb), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  if (t >= 12.85) {
    ctx.fillStyle = WHITE;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, lerp(0, 2600, easeOutExpo(remap(t, 12.85, 13.2))), 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderMobileScene6(t) {
  fillBG("#FFFFFF");
  drawDotGrid(.35);
  const glow = ctx.createRadialGradient(W / 2, 390, 0, W / 2, 390, 650);
  glow.addColorStop(0, "rgba(0,132,255,.12)");
  glow.addColorStop(1, "rgba(0,132,255,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  const logoIn = spring(remap(t, 13, 13.48), 3.5, 7);
  ctx.save();
  ctx.globalAlpha = logoIn;
  if (imgReady(imgLogo)) {
    const logoH = 150, logoW = Math.min(300, logoH * imgLogo.naturalWidth / imgLogo.naturalHeight);
    ctx.drawImage(imgLogo, (W - logoW) / 2, 225, logoW, logoH);
  } else {
    drawRRect(W / 2 - 70, 240, 140, 130, 28, null, CORAL, 3);
    drawText("OM", W / 2, 305, font(800, 48), CORAL, "center", "middle");
  }
  drawText("OMCAR", W / 2, 450, font(800, 110), INK, "center", "middle");
  drawText("CAR INSPECTION", W / 2, 535, font(700, 32), MUTED, "center", "middle");
  ctx.restore();

  const tagIn = easeOutExpo(remap(t, 13.55, 14.05));
  ctx.save();
  ctx.globalAlpha = tagIn;
  drawText("INSPECT CLEARLY.", W / 2, 690, fitFont("INSPECT CLEARLY.", 800, 48, 960, 32), INK, "center", "middle");
  drawText("DECIDE CONFIDENTLY.", W / 2, 755, fitFont("DECIDE CONFIDENTLY.", 800, 48, 960, 32), CORAL, "center", "middle");
  ctx.restore();

  const pathways = ["NEW CAR PDI", "USED CAR INSPECTION", "PDI TRAINING"];
  pathways.forEach((label, index) => {
    const p = spring(remap(t, 13.9 + index * .08, 14.3 + index * .08), 3.4, 7.5);
    ctx.save();
    ctx.globalAlpha = p;
    const y = 925 + index * 112 + lerp(25, 0, p);
    drawRRect(105, y, 870, 78, 39, WARM, BORDER, 2);
    ctx.fillStyle = CORAL;
    ctx.beginPath();
    ctx.arc(150, y + 39, 8, 0, Math.PI * 2);
    ctx.fill();
    drawText(label, 192, y + 39, fitFont(label, 800, 27, 730, 18), INK, "left", "middle");
    ctx.restore();
  });

  const infoIn = easeOutExpo(remap(t, 14.25, 14.68));
  ctx.save();
  ctx.globalAlpha = infoIn;
  drawText("om-car-inspection-software.vercel.app", W / 2, 1350, fitFont("om-car-inspection-software.vercel.app", 600, 23, 940, 16), MUTED, "center", "middle");
  drawText("8880339999", W / 2, 1420, font(800, 38), INK, "center", "middle");
  drawRRect(155, 1515, 770, 92, 46, CORAL);
  drawText("REQUEST AN INSPECTION", W / 2, 1561, fitFont("REQUEST AN INSPECTION", 800, 31, 720, 20), WHITE, "center", "middle");
  ctx.restore();
}

function preloadMobileSceneAssets(t) {
  if (!IS_MOBILE_LAYOUT) return;
  if (t >= 2.2) ensureAsset(imgCar);
  if (t >= 6.35) {
    ensureAsset(imgPDI);
    ensureAsset(imgUsed);
    ensureAsset(imgTraining);
  }
  if (t >= 11.15) ensureAsset(imgLogo);
}

window.seek = function(t) {
  try {
    ctx.save();
    ctx.clearRect(0, 0, W, H);

    if (IS_MOBILE_LAYOUT) {
      preloadMobileSceneAssets(t);
      if (t < 2.05) renderMobileScene1(t);
      else if (t < 4.1) renderMobileScene2(t);
      else if (t < 8.75) renderMobileScene3(t);
      else if (t < 11.95) renderMobileScene4(t);
      else if (t < 13.0) renderMobileScene5(t);
      else renderMobileScene6(t);
    } else {
      if (t < 2.05) renderScene1(t);
      else if (t < 4.1) renderScene2(t);
      else if (t < 8.75) renderScene3(t);
      else if (t < 11.95) renderScene4(t);
      else if (t < 13.0) renderScene5(t);
      else renderScene6(t);
    }

    ctx.restore();
  } catch(e) {
    console.error("Render error at t=" + t, e);
  }
};

// ─── REAL-TIME BROWSER PLAYER WITH ERROR SHIELD ───
let isPlaying = true;
let startTime = performance.now();
let currentTime = 0;
const DURATION = 15.0;

function syncCanvasOrientation() {
  const nextMobile = window.matchMedia("(max-width: 640px)").matches;
  if (nextMobile === IS_MOBILE_LAYOUT) return;
  IS_MOBILE_LAYOUT = nextMobile;
  W = nextMobile ? 1080 : 1920;
  H = nextMobile ? 1920 : 1080;
  canvas.width = nextMobile ? 720 : 1920;
  canvas.height = nextMobile ? 1280 : 1080;
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  if (!nextMobile) [imgLogo, imgPDI, imgUsed, imgTraining, imgCar].forEach(ensureAsset);
  window.seek(currentTime);
}
window.addEventListener("resize", syncCanvasOrientation, { passive: true });

let audioObj = null;
try {
  audioObj = new Audio('soundtrack.wav');
  audioObj.preload = 'auto';
} catch(e) {}

function loop(now) {
  if (isPlaying) {
    currentTime = (now - startTime) / 1000;
    if (currentTime >= DURATION) {
      currentTime = 0;
      startTime = performance.now();
      if (audioObj) {
        try {
          audioObj.currentTime = 0;
          audioObj.play().catch(() => {});
        } catch(e) {}
      }
    }
    window.seek(currentTime);
  }
  requestAnimationFrame(loop);
}

// Start loop
window.seek(0);
requestAnimationFrame(loop);
console.log("OMCAR Inspection Animation running in an automatic loop.");
</script>
