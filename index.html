<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#111111">
  <meta http-equiv="refresh" content="0;url=https://om-car-inspection-software.vercel.app/login">
  <title>OMKAR Car Inspection</title>
  <link rel="canonical" href="https://om-car-inspection-software.vercel.app/">
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101010;color:#f7f4ed}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,560px);padding:36px;border:1px solid #39352b;border-radius:20px;background:linear-gradient(145deg,#1b1b1b,#111)}
    .mark{font-size:12px;letter-spacing:.22em;color:#d8b66a;font-weight:700}
    h1{font-size:clamp(28px,6vw,42px);line-height:1.1;margin:18px 0 12px}
    p{line-height:1.65;color:#c8c5bd}
    nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
    a{display:inline-block;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:650}
    .primary{background:#d8b66a;color:#151515}
    .secondary{border:1px solid #62563b;color:#f7f4ed}
    small{display:block;margin-top:20px;color:#aaa59a}
  </style>
  <script>
    (function () {
      var target = "https://om-car-inspection-software.vercel.app";
      var path = window.location.pathname || "/";
      var isLocalFile = window.location.protocol === "file:" ||
        /^\/[a-z]:\//i.test(path) ||
        /(?:^|\/)(?:index|Software of Omkar Inspection)\.html$/i.test(path);

      // Local desktop files must open the React application, not route a local
      // C:\\ path through the production website.
      if (isLocalFile || path === "/" || path === "/index.html") {
        path = "/login";
      } else {
        path = path.replace(/^\/om-car-inspection-software(?=\/|$)/, "");
        if (!path) path = "/login";
      }
      window.location.replace(target + path + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body>
  <main>
    <div class="mark">OMKAR CAR INSPECTION</div>
    <h1>Inspect clearly. Decide confidently.</h1>
    <p>Opening the official OMKAR Car Inspection website. If automatic redirection is blocked, use one of the links below.</p>
    <nav>
      <a class="primary" href="https://om-car-inspection-software.vercel.app/">Open public website</a>
      <a class="secondary" href="https://om-car-inspection-software.vercel.app/login">Staff software sign-in</a>
    </nav>
    <small>The inspection software is private. Staff sign-in is required.</small>
  </main>
</body>
</html>
